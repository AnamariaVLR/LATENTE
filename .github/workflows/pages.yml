# Public preview on GitHub Pages — free, no account beyond GitHub itself.
#
# Builds the site under the /LATENTE base path and uses formsubmit.co for the
# inquiry form (Netlify Forms only exist on Netlify). Production still deploys to
# Netlify from netlify.toml with Netlify Forms at the root path.
#
# To receive inquiries from the preview, set a repository variable
# INQUIRY_EMAIL (Settings → Secrets and variables → Actions → Variables); the
# first submission emails that address a one-time activation link.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [claude/eager-brown-CmDby, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable GitHub Pages for this repository (idempotent)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate derived assets if missing (AVIF/WebP, font subsets)
        run: |
          python3 -m pip install --quiet fonttools brotli
          npm run assets

      - name: Build for the Pages sub-path
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_FORM_PROVIDER: formsubmit
          PUBLIC_INQUIRY_EMAIL: ${{ vars.INQUIRY_EMAIL }}
        run: |
          echo "site=$SITE_URL base=${BASE_PATH:-/}"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
