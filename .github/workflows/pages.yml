# Public preview on GitHub Pages — free, no account beyond GitHub itself.
#
# Builds the site under the /LATENTE base path and publishes the static output
# to the `gh-pages` branch, which GitHub Pages serves. The inquiry form uses
# formsubmit.co here (Netlify Forms only exist on Netlify); production still
# deploys to Netlify from netlify.toml with Netlify Forms at the root path.
#
# To receive inquiries from the preview, set a repository variable
# INQUIRY_EMAIL (Settings → Secrets and variables → Actions → Variables); the
# first submission emails that address a one-time activation link.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [claude/eager-brown-CmDby, main]
  # Monthly rebuild on the 1st (06:00 UTC): publishes any Field Note whose
  # date has arrived (src/content/insights) without anyone touching the repo.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate derived assets if missing (AVIF/WebP, font subsets)
        run: |
          python3 -m pip install --quiet fonttools brotli
          npm run assets

      - name: Build for the Pages sub-path
        env:
          PUBLIC_FORM_PROVIDER: formsubmit
          PUBLIC_INQUIRY_EMAIL: ${{ vars.INQUIRY_EMAIL }}
          # Optional custom domain you OWN (repository variable PAGES_CNAME).
          # When set, the site is built at the root path for that domain.
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "${PAGES_CNAME:-}" ]; then
            export SITE_URL="https://${PAGES_CNAME}"
            export BASE_PATH="/"
          else
            export SITE_URL="https://${owner}.github.io"
            export BASE_PATH="/${repo}"
          fi
          echo "site=$SITE_URL base=$BASE_PATH"
          npm run build
          # Pages must not run Jekyll over the Astro output (it drops _astro/).
          touch dist/.nojekyll

      - name: Publish dist to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          # Keeps the custom domain across publishes (empty = none).
          cname: ${{ vars.PAGES_CNAME }}
          commit_message: 'Publish preview from ${{ github.sha }}'

      # If production runs on Netlify, the same monthly schedule can trigger it:
      # add a repository secret NETLIFY_BUILD_HOOK (Netlify → Site configuration →
      # Build hooks) and it is called here. Silently skipped when unset.
      - name: Trigger the Netlify production build (optional)
        if: ${{ github.event_name == 'schedule' }}
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" >/dev/null && echo "Netlify build triggered"; else echo "no NETLIFY_BUILD_HOOK set — skipped"; fi
